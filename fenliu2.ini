# Clash Configuration with Enhanced Proxy Groups for Manual Node Selection
# Optimized for Twitter, Disney+, HBO Max, Pornhub, YouTube, Google, AI, Telegram, Gaming, TikTok
# Based on rules from GitHub repositories like Loyalsoldier/clash-rules, G4free/clash-ruleset, and manual additions
# Ensures each service has a selectable proxy group in Clash client
# Add this to your Clash config, ensuring 'proxies:' section with your nodes is defined

dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    "hbomax.com,hbo.com,hbonow.com,max.com,hbomaxcdn.com,api.hbomax.com,prod.hbomax.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "twitter.com,x.com,t.co": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "disneyplus.com,disney.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "youtube.com,googlevideo.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "tiktok.com,tiktokcdn.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "pornhub.com,pornhubpremium.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "telegram.org,telegram.me": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "google.com,googleapis.com,gstatic.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "chat.openai.com,openai.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "steampowered.com,epicgames.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query

proxy-groups:
  # Main PROXY group for general proxy traffic (fallback)
  - name: PROXY
    type: select
    proxies:
      - Proxy1  # Replace with your actual proxy node names
      - Proxy2
      - AUTO  # Fallback to url-test group
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # Auto-test group for fallback
  - name: AUTO
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # Twitter-specific group
  - name: Twitter
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://www.twitter.com
    interval: 300
    tolerance: 50

  # Disney+-specific group
  - name: Disney
    type: select
    proxies:
      - US-Streaming1  # Replace with Disney+-compatible US nodes
      - US-Streaming2
      - PROXY
    url: https://www.disneyplus.com
    interval: 300
    tolerance: 50

  # HBO Max-specific group
  - name: HBO
    type: select
    proxies:
      - US-Streaming1  # Replace with HBO Max-compatible US nodes
      - US-Streaming2
      - PROXY
    url: https://www.hbomax.com
    interval: 300
    tolerance: 50

  # Pornhub-specific group
  - name: Pornhub
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://www.pornhub.com
    interval: 300
    tolerance: 50

  # YouTube-specific group
  - name: YouTube
    type: select
    proxies:
      - US-Streaming1  # Replace with YouTube-compatible nodes
      - US-Streaming2
      - PROXY
    url: https://www.youtube.com
    interval: 300
    tolerance: 50

  # Google-specific group (includes FCM)
  - name: Google
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://www.google.com
    interval: 300
    tolerance: 50

  # AI-specific group (ChatGPT, etc.)
  - name: ChatGPT
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://chat.openai.com
    interval: 300
    tolerance: 50

  # Telegram-specific group
  - name: Telegram
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://telegram.org
    interval: 300
    tolerance: 50

  # Gaming-specific group (Steam, Epic Games, etc.)
  - name: Gaming
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://store.steampowered.com
    interval: 300
    tolerance: 50

  # TikTok-specific group
  - name: TikTok
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://www.tiktok.com
    interval: 300
    tolerance: 50

  # GitHub-specific group
  - name: GitHub
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://github.com
    interval: 300
    tolerance: 50

  # Netflix-specific group
  - name: Netflix
    type: select
    proxies:
      - US-Streaming1  # Replace with Netflix-compatible US nodes
      - US-Streaming2
      - PROXY
    url: https://www.netflix.com
    interval: 300
    tolerance: 50

  # Apple-specific group
  - name: Apple
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://www.apple.com
    interval: 300
    tolerance: 50

  # Direct connection group
  - name: DIRECT
    type: select
    proxies:
      - DIRECT

  # Reject group for ads and blocked traffic
  - name: REJECT
    type: select
    proxies:
      - REJECT

rule-providers:
  reject:  # AdBlock, 广告拦截, 应用净化
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  cndomain:  # 国内媒体直连
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cndomain.txt"
    path: ./ruleset/cndomain.yaml
    interval: 86400

  cncidr:  # 国内媒体直连 (IP)
    type: http
