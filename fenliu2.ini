  google:  # Google, YouTube (supplement), FCM
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400

  gaming:  # 游戏平台 (Steam, Epic Games, etc.)
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gaming.txt"
    path: ./ruleset/gaming.yaml
    interval: 86400

  proxy:  # GitHub, general blocked sites
    type: http
    behavior: domain
