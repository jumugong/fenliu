  tiktok:  # TikTok
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tiktok.txt"
    path: ./ruleset/tiktok.yaml
    interval: 86400

  pornhub:  # Pornhub
    type: http
    behavior: classical
    url: "data:,"  # Inline rules
    path: ./ruleset/pornhub.yaml
    interval: 0
    # Inline content: DOMAIN-SUFFIX,pornhub.com,PROXY\nDOMAIN-SUFFIX,pornhubpremium.com,PROXY

  twitter:  # Twitter/X
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/twitter.txt"
    path: ./ruleset/twitter.yaml
    interval: 86400

  telegram:  # Telegram
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegram.txt"
    path: ./ruleset/telegram.yaml
