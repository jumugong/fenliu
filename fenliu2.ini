    path: ./ruleset/proxy.yaml
    interval: 86400

  chatgpt:  # AI (ChatGPT, etc.)
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/G4free/clash-ruleset/main/ruleset/ChatGPT.yaml"
    path: ./ruleset/ChatGPT.yaml
    interval: 86400

rules:
  # 广告拦截, AdBlock, 应用净化 (first to block ads)
  - RULE-SET,reject,REJECT

  # 国内媒体直连
  - RULE-SET,cndomain,DIRECT
  - RULE-SET,cncidr,DIRECT
  - GEOIP,CN,DIRECT
  - GEOIP,LAN,DIRECT

  # 全球直连 (direct for whitelisted)
  - RULE-SET,direct,DIRECT

  # Specific proxy for listed services, mapped to corresponding proxy groups
  - RULE-SET,twitter,Twitter  # Twitter/X
  - RULE-SET,disney,Disney  # Disney+
  - RULE-SET,hbo,HBO  # HBO Max
  - RULE-SET,pornhub,Pornhub  # Pornhub
  - RULE-SET,youtube,YouTube  # YouTube
  - RULE-SET,google,Google  # Google, YouTube supplement, FCM
  - RULE-SET,chatgpt,ChatGPT  # AI
  - RULE-SET,telegram,Telegram  # Telegram
  - RULE-SET,gaming,Gaming  # 游戏平台
  - RULE-SET,tiktok,TikTok  # TikTok
  - RULE-SET,netflix,Netflix  # Netflix
  - RULE-SET,apple,Apple  # Apple
  - RULE-SET,proxy,GitHub  # GitHub and other blocked

  # Final rule: global fallback to PROXY group
  - MATCH,PROXY  # Adjust to DIRECT if you want global direct
