# Clash Configuration with Proxy Groups and Custom Rules
# Enhanced with individual proxy groups for Netflix, Disney+, HBO Max, YouTube, TikTok, Pornhub, etc.
# Based on rules from GitHub repositories like Loyalsoldier/clash-rules, G4free/clash-ruleset, and manual additions
# Add this to your Clash config, ensuring 'proxies:' section with your nodes (e.g., Proxy1, Proxy2) is defined

proxy-groups:
  # Main PROXY group for general proxy traffic
  - name: PROXY
    type: url-test
    proxies:
      - Proxy1  # Replace with your actual proxy node names
      - Proxy2
      # Add more proxies as needed
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # Netflix-specific group
  - name: Netflix
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add Netflix-optimized nodes
    url: https://www.netflix.com
    interval: 300
    tolerance: 50

  # Disney+-specific group
  - name: Disney
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add Disney+-optimized nodes
    url: https://www.disneyplus.com
    interval: 300
    tolerance: 50

  # HBO Max-specific group
  - name: HBO
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add HBO Max-optimized nodes
    url: https://www.hbomax.com
    interval: 300
