      # Add YouTube-optimized nodes
    url: https://www.youtube.com
    interval: 300
    tolerance: 50

  # TikTok-specific group
  - name: TikTok
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add TikTok-optimized nodes
    url: https://www.tiktok.com
    interval: 300
    tolerance: 50

  # Pornhub-specific group
  - name: Pornhub
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add nodes suitable for Pornhub
    url: https://www.pornhub.com
    interval: 300
    tolerance: 50

  # Twitter-specific group
  - name: Twitter
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add Twitter-optimized nodes
    url: https://www.twitter.com
    interval: 300
    tolerance: 50

  # Telegram-specific group
  - name: Telegram
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add Telegram-optimized nodes
    url: https://telegram.org
    interval: 300
    tolerance: 50

  # Apple-specific group
  - name: Apple
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add Apple-optimized nodes
    url: https://www.apple.com
    interval: 300
    tolerance: 50

  # Google-specific group (includes FCM)
  - name: Google
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add Google-optimized nodes
    url: https://www.google.com
    interval: 300
    tolerance: 50

  # Gaming-specific group (Steam, Epic Games, etc.)
  - name: Gaming
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add gaming-optimized nodes
    url: https://store.steampowered.com
    interval: 300
    tolerance: 50

  # AI-specific group (ChatGPT, etc.)
  - name: ChatGPT
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add AI-optimized nodes
    url: https://chat.openai.com
    interval: 300
    tolerance: 50

  # GitHub-specific group
  - name: GitHub
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
      # Add GitHub-optimized nodes
    url: https://github.com
    interval: 300
    tolerance: 50

  # Direct connection group
  - name: DIRECT
    type: select
    proxies:
      - DIRECT

  # Reject group for ads and blocked traffic
  - name: REJECT
    type: select
    proxies:
      - REJECT

rule-providers:
  reject:  # AdBlock, 广告拦截, 应用净化
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  cndomain:  # 国内媒体直连
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cndomain.txt"
    path: ./ruleset/cndomain.yaml
    interval: 86400

  cncidr:  # 国内媒体直连 (IP)
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400

  direct:  # 全球直连 (non-blocked domestic/international direct)
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
