# Clash Configuration with INI Rule Integration
# Optimized for Twitter, Disney+, HBO Max, Pornhub, YouTube, Google, AI, Telegram, Gaming, TikTok
# References main.ini for domain-based rules
# Features:
# - Select-type proxy groups for manual node selection in Clash client
# - DNS settings to prevent leaks and ensure streaming unblock (e.g., HBO Max)
# - Date: 2025-09-25 09:56 HKT

# DNS Configuration to Prevent Leaks
dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 1.1.1.1  # Cloudflare DNS
    - 8.8.8.8  # Google DNS
  proxy-server-nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    "hbomax.com,hbo.com,hbonow.com,max.com,hbomaxcdn.com,api.hbomax.com,prod.hbomax.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "twitter.com,x.com,t.co": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "disneyplus.com,disney.com,bamgrid.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "youtube.com,googlevideo.com,ytimg.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "tiktok.com,tiktokcdn.com,tiktokv.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "pornhub.com,pornhubpremium.com,phncdn.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "telegram.org,telegram.me,t.me": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "google.com,googleapis.com,gstatic.com,firebaseio.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "chat.openai.com,openai.com,ai.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "steampowered.com,epicgames.com,steamstatic.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "github.com,github.io,raw.githubusercontent.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "netflix.com,nflxvideo.net,nflxso.net": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    "apple.com,icloud.com,cdn-apple.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query

# Proxy Groups for Manual Node Selection
proxy-groups:
  # Main PROXY group (general proxy traffic, fallback)
  - name: PROXY
    type: select
    proxies:
      - Proxy1  # Replace with your actual proxy node names
      - Proxy2
      - AUTO
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # Auto-test group for fallback
  - name: AUTO
    type: url-test
    proxies:
      - Proxy1
      - Proxy2
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # Twitter/X group
  - name: Twitter
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://www.twitter.com
    interval: 300
    tolerance: 50

  # Disney+ group
  - name: Disney
    type: select
    proxies:
      - US-Streaming1  # Replace with Disney+-compatible US nodes
      - US-Streaming2
      - PROXY
    url: https://www.disneyplus.com
    interval: 300
    tolerance: 50

  # HBO Max group
  - name: HBO
    type: select
    proxies:
      - US-Streaming1  # Replace with HBO Max-compatible US nodes
      - US-Streaming2
      - PROXY
    url: https://www.hbomax.com
    interval: 300
    tolerance: 50

  # Pornhub group
  - name: Pornhub
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://www.pornhub.com
    interval: 300
    tolerance: 50

  # YouTube group
  - name: YouTube
    type: select
    proxies:
      - US-Streaming1  # Replace with YouTube-compatible nodes
      - US-Streaming2
      - PROXY
    url: https://www.youtube.com
    interval: 300
    tolerance: 50

  # Google group (includes FCM)
  - name: Google
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://www.google.com
    interval: 300
    tolerance: 50

  # AI group (ChatGPT, etc.)
  - name: ChatGPT
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://chat.openai.com
    interval: 300
    tolerance: 50

  # Telegram group
  - name: Telegram
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://telegram.org
    interval: 300
    tolerance: 50

  # Gaming group (Steam, Epic Games, etc.)
  - name: Gaming
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://store.steampowered.com
    interval: 300
    tolerance: 50

  # TikTok group
  - name: TikTok
    type: select
    proxies:
      - US-Streaming1  # Replace with TikTok-compatible nodes
      - US-Streaming2
      - PROXY
    url: https://www.tiktok.com
    interval: 300
    tolerance: 50

  # GitHub group
  - name: GitHub
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://github.com
    interval: 300
    tolerance: 50

  # Netflix group
  - name: Netflix
    type: select
    proxies:
      - US-Streaming1  # Replace with Netflix-compatible nodes
      - US-Streaming2
      - PROXY
    url: https://www.netflix.com
    interval: 300
    tolerance: 50

  # Apple group
  - name: Apple
    type: select
    proxies:
      - Proxy1
      - Proxy2
      - PROXY
    url: https://www.apple.com
    interval: 300
    tolerance: 50

  # Direct connection group
  - name: DIRECT
    type: select
    proxies:
      - DIRECT

  # Reject group for ads and blocked traffic
  - name: REJECT
    type: select
    proxies:
      - REJECT

# Rule Providers
rule-providers:
  main:  # Custom rules from main.ini
    type: file
    behavior: classical
    path: ./main.ini
    interval: 86400

  reject:  # AdBlock, 广告拦截, 应用净化 (supplement)
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  cndomain:  # 国内媒体直连 (supplement)
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cndomain.txt"
    path: ./ruleset/cndomain.yaml
    interval: 86400

  cncidr:  # 国内媒体直连 (IP)
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400

  direct:  # 全球直连 (supplement)
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400

# Rules for Traffic Splitting
rules:
  # Block ads and trackers
  - RULE-SET,reject,REJECT
  - RULE-SET,main,REJECT,group=Reject

  # Domestic media direct connection
  - RULE-SET,cndomain,DIRECT
  - RULE-SET,cncidr,DIRECT
  - GEOIP,CN,DIRECT
  - GEOIP,LAN,DIRECT
  - RULE-SET,main,DIRECT,group=Domestic
  - RULE-SET,main,DIRECT,group=Direct

  # Service-specific proxy groups
  - RULE-SET,main,Twitter,group=Twitter
  - RULE-SET,main,Disney,group=Disney
  - RULE-SET,main,HBO,group=HBO
  - RULE-SET,main,Pornhub,group=Pornhub
  - RULE-SET,main,YouTube,group=YouTube
  - RULE-SET,main,Google,group=Google
  - RULE-SET,main,ChatGPT,group=ChatGPT
  - RULE-SET,main,Telegram,group=Telegram
  - RULE-SET,main,Gaming,group=Gaming
  - RULE-SET,main,TikTok,group=TikTok
  - RULE-SET,main,Netflix,group=Netflix
  - RULE-SET,main,Apple,group=Apple
  - RULE-SET,main,GitHub,group=GitHub
  - RULE-SET,main,PROXY,group=Proxy

  # Fallback to PROXY for unmatched traffic
  - MATCH,PROXY
  # Final rule: global fallback to PROXY group
  - MATCH,PROXY  # Adjust to DIRECT if you want global direct
