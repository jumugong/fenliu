  hbo:  # HBO Max
    type: http
    behavior: classical
    url: "data:,"  # Inline rules
    path: ./ruleset/hbo.yaml
    interval: 0
    # Inline content: DOMAIN-SUFFIX,hbomax.com,PROXY\nDOMAIN-SUFFIX,hbo.com,PROXY\nDOMAIN-SUFFIX,hbonow.com,PROXY

  youtube:  # YouTube
