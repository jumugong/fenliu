#### 2. config.yaml (Clash 主配置文件)
以下是配套的 Clash YAML 配置文件，引用 `main.ini` 并定义策略组，确保 Twitter、Disney+、HBO Max 等服务分流到独立的可选节点策略组。

<xaiArtifact artifact_id="116022cf-1e22-41fb-899e-a695fae3dc71" artifact_version_id="b4541bbb-24c4-4901-b4ca-73b7a7eb269a" title="config.yaml" contentType="text/yaml">
