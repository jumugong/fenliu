  hbo:  # HBO Max
    type: http
    behavior: classical
    url: "data:,"  # Inline rules
    path: ./ruleset/hbo.yaml
    interval: 0
    # Inline content: DOMAIN-SUFFIX,hbomax.com,PROXY\nDOMAIN-SUFFIX,hbo.com,PROXY\nDOMAIN-SUFFIX,hbonow.com,PROXY\nDOMAIN-SUFFIX,max.com,PROXY\nDOMAIN-SUFFIX,hbomaxcdn.com,PROXY\nDOMAIN,api.hbomax.com,PROXY\nDOMAIN,prod.hbomax.com,PROXY

  youtube:  # YouTube
    type: http
    behavior: domain
