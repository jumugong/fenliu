# Clash Configuration - Full Optimized for N5000
# Features: redir-host DNS, geosite policy, DIRECT first, url-test media groups
# Add your proxies section here (from subscription)
# Date: 2025-10-26

# Proxies (示例 - 从订阅导入实际节点)
proxies:
  - name: "Your-Proxy1"  # e.g., VMess/Trojan 节点
    type: vmess  # 或 trojan/wireguard (WireGuard CPU 友好)
    server: your.server.com
    port: 443
    uuid: your-uuid
    alterId: 0
    cipher: auto
    tls: true
    network: ws
    ws-path: /path
    ws-headers:
      Host: your.host.com
  # 添加更多节点...

# DNS Configuration (redir-host for low overhead)
dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  nameserver:
    - 114.114.114.114  # 国内直连加速
    - 223.5.5.5
    - 1.1.1.1
    - 8.8.8.8
  fallback:  # 备用
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  proxy-server-nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    'geosite:hbo-max': 
      - https://dns.google/dns-query#🎥 HBO Max
      - https://cloudflare-dns.com/dns-query#🎥 HBO Max
    'geosite:disney': 
      - https://dns.google/dns-query#🎥 迪士尼
      - https://cloudflare-dns.com/dns-query#🎥 迪士尼
    'apple.com,icloud.com,2.pool.ntp.org,*.pool.ntp.org': 
      - 114.114.114.114#🍎 Apple  # 国内备用
      - https://dns.google/dns-query#🍎 Apple
    'geosite:twitter': 
      - https://dns.google/dns-query#🚗 推特
      - https://cloudflare-dns.com/dns-query#🚗 推特
    'geosite:youtube': 
      - https://dns.google/dns-query#📹 YouTube
      - https://cloudflare-dns.com/dns-query#📹 YouTube
    'geosite:netflix': 
      - https://dns.google/dns-query#🎥 Netflix
      - https://cloudflare-dns.com/dns-query#🎥 Netflix
    'geosite:pornhub': 
      - https://dns.google/dns-query#🎥 Pornhub
    'geosite:tiktok': 
      - https://dns.google/dns-query#🎵 TikTok
    'geosite:telegram': 
      - https://dns.google/dns-query#📲 Telegram
    'geosite:google': 
      - https://dns.google/dns-query#🍀 Google
    'geosite:openai,chat.openai.com': 
      - https://dns.google/dns-query#🤖 AI
    'geosite:steam,epicgames.com': 
      - https://dns.google/dns-query#🎮 游戏平台
    'geosite:github': 
      - https://dns.google/dns-query#👨🏿‍💻 GitHub

