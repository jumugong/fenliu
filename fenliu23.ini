# Clash Configuration with INI Rule Integration
# Optimized for Twitter, Disney+, HBO Max, Pornhub, YouTube, Google, AI, Telegram, Gaming, TikTok
# Features:
# - Expanded HBO Max domains in nameserver-policy for Apple TV compatibility
# - Prioritizes Taiwan nodes (in 其他地区) for HBO Max to avoid 漏网之鱼
# - Ensures HBO Max and Disney+ DNS and traffic consistency
# - Date: 2025-09-28 13:33 CST

# DNS Configuration to Prevent Leaks
dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 1.1.1.1  # Cloudflare DNS
    - 8.8.8.8  # Google DNS
  proxy-server-nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    "hbomax.com,hbo.com,hbonow.com,max.com,hbomaxcdn.com,discomax.com,api.hbomax.com,prod.hbomax.com,default.any-any.prd.api.discomax.com,events.brightline.tv,*.hbomax.com,*.max.com,*.hbo.com,*.discomax.com,*.brightline.tv,ads.hbomax.com,analytics.hbomax.com":
      - https://dns.google/dns-query#🎥 HBO Max
      - https://cloudflare-dns.com/dns-query#🎥 HBO Max
    "disneyplus.com,disney.com,bamgrid.com,*.disneyplus.com,*.disney.com": 
      - https://dns.google/dns-query#🎥 迪士尼
      - https://cloudflare-dns.com/dns-query#🎥 迪士尼
    "twitter.com,x.com,t.co,twimg.com": 
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
